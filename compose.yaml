name: home-ledger-dev

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    init: true
    restart: unless-stopped

  test:
    build:
      context: .
      target: development
    profiles: ["tools"]
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: npm run test:coverage

  lint:
    build:
      context: .
      target: development
    profiles: ["tools"]
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: npm run lint

volumes:
  app_node_modules: